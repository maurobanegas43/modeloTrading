[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-ml-paper-trader"
version = "0.5.0"
description = "Binance Spot ML research: backtesting and paper trading only"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "websockets>=13,<17",
  "optuna>=3.9,<5",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.1,<4"]

[project.scripts]
binance-ml = "trading_ml.presentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

